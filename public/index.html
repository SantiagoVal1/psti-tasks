
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSTI Tasks - Gestor de tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>PSTI Tasks</h1>
            <p>Organiza tus tareas y fechas límite.</p>
        </header>

        <section class="form-section">
            <h2 id="form-title">Nueva tarea</h2>

            <form id="task-form">
                <label for="task-id">ID de la tarea</label>
                <input type="number" id="task-id" required>

                <label for="task-name">Nombre de la tarea</label>
                <input type="text" id="task-name" required>

                <label for="task-deadline">Fecha límite</label>
                <input type="date" id="task-deadline" required>

                <button type="submit" id="submit-button">Crear tarea</button>
                <button type="button" id="cancel-button" hidden>Cancelar edición</button>
            </form>

            <p id="message" role="status"></p>
        </section>

        <section>
            <h2>Mis tareas</h2>
            <div id="task-list">Cargando tareas...</div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
